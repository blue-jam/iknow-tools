services:
  collector:
    image: ${IKNOW_IMAGE:-ghcr.io/blue-jam/iknow-tools:latest}
    pull_policy: always
    user: "10001:10001"
    environment:
      IKNOW_USER_ID: ${IKNOW_USER_ID:?Set IKNOW_USER_ID in .env}
      IKNOW_DATA_DIR: /data
      TZ: Asia/Tokyo
    volumes:
      - iknow-data:/data
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - collector
    environment:
      TZ: Asia/Tokyo
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - iknow-data:/data:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  iknow-data:
    name: iknow-tools-data
